<!doctype html>
<html><head><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>千千音乐 · 个人媒体库</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;font:12px "Microsoft YaHei",Tahoma,sans-serif;color:#294452;background:#f5f9fb}*{box-sizing:border-box}button,input,select{font:inherit;color:inherit;border:1px solid #cfdee6;background:white;border-radius:5px;padding:4px}button{cursor:pointer}button:disabled{color:#98a7ae;cursor:default}button:hover{background:#e6f3f9}#head{padding:7px 9px;background:#eaf4f9;border-bottom:1px solid #dce7ed}#settings{width:22px;height:22px;padding:0;border:0;background:none;font:18px "Segoe UI Symbol",sans-serif;color:#748a97}#searchline{margin-top:0}#category{width:24%}#searchtext{width:51%}#navigation{padding:4px 9px;height:34px;border-bottom:1px solid #dce7ed;white-space:nowrap}#location{display:inline-block;width:80%;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;font-size:12px}#content{overflow:auto;padding:5px 9px}table{width:100%;border-collapse:collapse;table-layout:fixed}td{padding:4px 3px;border-bottom:1px solid #e2eaf0;word-wrap:break-word}td.pick{width:23px}td.action{width:65px;white-space:nowrap}.action button{width:21px;height:24px;padding:0;border:0;background:none;color:#849ca9}.action button:hover{color:#2386ad;background:#dbeef7}td.time{width:40px;font-size:11px;color:#758b98}tr.selected{background:#dff0f8}.title{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#758b98;line-height:1.5}#detail{display:none;height:94px;padding:7px 12px;background:#eaf3f8;overflow:auto}#cover{width:76px;height:76px;float:left;margin-right:10px}#lyrics{white-space:pre-wrap;word-wrap:break-word;margin:4px 0;font:12px "Microsoft YaHei",sans-serif}#footer{padding:5px 8px;background:#fff;border-top:1px solid #dce7ed}#footer-tools{width:100%;border-collapse:collapse}#footer-tools td{padding:0;border:0;white-space:nowrap}#footer-tools .bulk{width:145px;text-align:right}#footer-tools .gear{width:26px;text-align:right}#footer button{padding:0 3px;height:20px;border-radius:1px;font-size:11px;color:#617c8b}#footer button:disabled{color:#b2c0c7}#footer #settings{height:22px;font-size:18px}#paging button{min-width:17px;padding:0 3px;color:#748a97;margin-right:2px}#paging .current{color:#fff;background:#83aabc;border-color:#83aabc}#status{font-size:11px;line-height:1.6;margin-bottom:4px;word-wrap:break-word}#count{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#empty{text-align:center;padding:32px 12px;color:#758b98}#close{float:right}
#source-menu{position:fixed;right:8px;bottom:32px;z-index:10;min-width:160px;max-width:90%;max-height:60%;overflow:auto;background:#fff;border:1px solid #afc5d1;padding:3px;box-shadow:0 3px 12px #b7c8d1}#source-menu button{display:block;width:100%;text-align:left;border:0;border-radius:2px;padding:6px 8px;white-space:normal;word-wrap:break-word;background:white}#source-menu button:hover,#source-menu button:focus{background:#dceef7}#source-menu .check{display:inline-block;width:20px;color:#2386ad}#source-menu .menu-divider{border-top:1px solid #dce7ed;margin:3px 0}</style></head><body>
<div id="head"><div id="searchline"><select id="category"></select> <input id="searchtext" maxlength="256" placeholder="搜索歌曲…"> <button id="search">搜索</button></div></div>
<div id="navigation"><button id="back">返回</button> <span id="location">正在连接…</span></div>
<div id="content"><div id="empty">正在读取媒体库…</div></div>
<div id="detail"><button id="close">×</button><img id="cover" alt="封面"><strong id="title"></strong><pre id="lyrics"></pre></div>
<div id="footer"><div id="status"></div><table id="footer-tools"><tbody><tr><td id="paging"><button id="previous" title="上一页" aria-label="上一页">‹</button><span id="page-numbers"></span><button id="next" title="下一页" aria-label="下一页">›</button></td><td class="bulk"><button id="play">▶播放</button> <button id="add">＋添加</button> <button id="download">↓下载</button><span id="count" role="status"></span></td><td class="gear"><button id="settings" title="音乐窗设置" aria-label="设置与媒体来源" aria-haspopup="menu" aria-expanded="false">&#9881;</button></td></tr></tbody></table></div>
<div id="source-menu" role="menu" aria-label="设置与媒体来源" style="display:none"></div>
<script>
(function(){
if(!window.JSON||!JSON.parse||!JSON.stringify)return;
var serial=0,pending={},profiles=[],source=0,query={},history=[],page={items:[],token:0},selected={},generation=0,detailGeneration=0,busy=false,initialized=false,knownPages={};
function isFiles(){return profiles[source]&&profiles[source].provider===1;}
function $(id){return document.getElementById(id);}function text(e,s){while(e.firstChild)e.removeChild(e.firstChild);e.appendChild(document.createTextNode(s||''));}
function node(tag,cls,s){var e=document.createElement(tag);e.className=cls||'';if(s!==undefined)text(e,s);return e;}
function status(s){text($('status'),s);$('status').style.display=s?'block':'none';layout();}function layout(){var h=document.documentElement.clientHeight-$('head').offsetHeight-$('navigation').offsetHeight-$('footer').offsetHeight-($('detail').style.display==='block'?94:0);$('content').style.height=Math.max(40,h)+'px';}
function rpc(op,args,cb){var id=++serial,m=args||{};m.id=id;m.op=op;pending[id]={cb:cb||function(){},timer:setTimeout(function(){finish(id,null,'请求超时，请重试');},45000)};setTimeout(function(){try{window.external.send(JSON.stringify(m));}catch(e){finish(id,null,'无法访问播放器接口');}},0);}
function finish(id,data,error){var p=pending[id];if(!p)return;delete pending[id];clearTimeout(p.timer);p.cb(data,error);}
function nav(){$('back').disabled=!history.length;$('previous').disabled=busy||!query.page;$('next').disabled=busy||!page.more;var key=JSON.stringify([source,query.view,query.path,query.text]),last=knownPages[key]||0;
if(!busy){last=page.more?Math.max(last,query.page+1):query.page;knownPages[key]=last;}var parent=$('page-numbers');text(parent,'');var start=Math.max(0,Math.min(query.page-2,last-4));for(var i=start;i<=Math.min(last,start+4);++i)(function(n){var b=node('button',n===query.page?'current':'',String(n+1));b.disabled=busy;b.setAttribute('aria-label','第 '+(n+1)+' 页');if(n===query.page)b.setAttribute('aria-current','page');b.onclick=function(){if(n!==query.page){query.page=n;load();}};parent.appendChild(b);})(i);rpc('navigation',{canBack:history.length>0});}
function indices(){var a=[],i;for(i=0;i<page.items.length;++i)if(selected[i]&&page.items[i].kind===0)a.push(i);return a;}
function selection(){var a=indices(),rows=$('content').getElementsByTagName('tr'),i;for(i=0;i<rows.length;++i)rows[i].className=selected[i]?'selected':'';$('play').disabled=$('add').disabled=$('download').disabled=busy||!a.length;text($('count'),a.length?'已选 '+a.length+' 首':'未选择歌曲');}
function hideDetails(){++detailGeneration;$('detail').style.display='none';$('cover').removeAttribute('src');layout();}
function details(i){var item=page.items[i],gen=++detailGeneration,token=page.token;$('detail').style.display='block';$('cover').style.display='none';text($('title'),item.title);text($('lyrics'),[item.artist,item.album].join(' · '));layout();rpc('details',{token:token,index:i},function(d,error){if(gen!==detailGeneration||token!==page.token)return;if(error){status(error);return;}if(d.image){$('cover').src=d.image;$('cover').style.display='block';}text($('lyrics'),[item.artist,item.album,d.lyrics].join('\n'));});}
function act(op,single){var a=single||indices();if(!a.length||busy)return;rpc(op,{token:page.token,indices:a},function(d,error){status(error||(op==='download'?'已加入下载管理':op==='play'?'已交给千千播放':'已加入播放列表'));});}
function open(i){var item=page.items[i];if(item.kind===0){selected={};selected[i]=true;selection();act('play');return;}history.push(query);query={view:({1:6,2:7,3:8,4:5})[item.kind],path:item.id,text:'',page:0};load();}
function render(){var main=$('content');text(main,'');if(!page.items.length){main.appendChild(node('div','meta','这里暂时没有音乐。请切换分类、搜索或检查媒体来源设置。'));return;}
var table=node('table'),body=node('tbody');table.appendChild(body);main.appendChild(table);var all=node('button','','全选本页歌曲');all.onclick=function(){var any=indices().length>0;selected={};for(var i=0;i<page.items.length;++i){if(!any&&page.items[i].kind===0)selected[i]=true;}render();selection();};main.insertBefore(all,table);
for(var i=0;i<page.items.length;++i)(function(i){var item=page.items[i],row=node('tr'),pick=node('td','pick'),name=node('td'),time=node('td','time'),action=node('td','action'),title=node('div','title',item.title),meta=node('div','meta',[item.artist,item.album].join(' · '));row.appendChild(pick);row.appendChild(name);row.appendChild(time);row.appendChild(action);name.appendChild(title);name.appendChild(meta);body.appendChild(row);
if(item.kind===0){var checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=!!selected[i];checkbox.onclick=function(){selected[i]=checkbox.checked;selection();};pick.appendChild(checkbox);title.onclick=function(){details(i);};title.ondblclick=function(){open(i);};text(time,item.duration?Math.floor(item.duration/60)+':'+('0'+item.duration%60).slice(-2):'');var ops=['play','add','download'],icons=['▶','＋','↓'],labels=['播放','添加','下载'];for(var n=0;n<3;++n)(function(n){var button=node('button','action-'+ops[n],icons[n]);button.title=labels[n]+' '+item.title;button.setAttribute('aria-label',button.title);button.onclick=function(){act(ops[n],[i]);};action.appendChild(button);})(n);}else{text(pick,item.kind===4?'▰':'♪');title.onclick=function(){open(i);};var enter=node('button','','打开');enter.onclick=function(){open(i);};action.appendChild(enter);} })(i);selection();}
function load(){if(!profiles.length)return emptySources();var gen=++generation;busy=true;selected={};page={items:[],token:0};hideDetails();text($('content'),'正在读取音乐…');status('正在读取媒体库…');selection();nav();rpc('browse',{profile:source,profileId:profiles[source].id,view:query.view,path:query.path,text:query.text,page:query.page},function(data,error){if(gen!==generation)return;busy=false;if(error){text($('content'),error);status(error);nav();return;}page=data;text($('location'),query.view===9?'搜索：'+query.text:data.description||profiles[source].name);render();nav();status('');layout();});}
function root(){history=[];query={view:isFiles()?5:0,path:profiles[source].root,text:'',page:0};$('searchtext').value='';$('category').selectedIndex=0;load();}
function emptySources(){++generation;busy=false;selected={};page={items:[],token:0};hideDetails();text($('category'),'');text($('content'),'暂无媒体来源，请从右下角菜单进入设置添加。');text($('location'),'媒体来源');selection();nav();status('');}
function changeSource(){closeMenu(false);$('searchtext').disabled=$('search').disabled=$('category').disabled=!profiles.length;knownPages={};if(!profiles.length){history=[];query={view:0,path:'',text:'',page:0};emptySources();return;}source=0;for(var n=0;n<profiles.length;++n)if(profiles[n].active)source=n;var c=$('category');text(c,'');var names=isFiles()?['文件夹']:['最新专辑','歌手','歌单','全部歌曲','收藏歌曲'];for(var i=0;i<names.length;++i){var o=node('option','',names[i]);o.value=isFiles()?5:i;c.appendChild(o);}root();}
function init(){if(initialized)return;initialized=true;rpc('profiles',{},function(p,error){if(error){initialized=false;status(error);return;}profiles=p;changeSource();});}
function back(){if(history.length){query=history.pop();load();}}
window.ttReceive=function(json){var m=JSON.parse(json);if(m.event==='ready')init();else if(m.event==='refresh')load();else if(m.event==='back')back();else if(m.event==='profilesChanged')rpc('profiles',{},function(p,e){if(e)status(e);else{profiles=p;changeSource();}});else finish(m.id,m.data,m.ok?null:m.error);};
function closeMenu(focus){$('source-menu').style.display='none';$('settings').setAttribute('aria-expanded','false');if(focus)$('settings').focus();}
function openMenu(){var menu=$('source-menu');if(menu.style.display!=='none'){closeMenu(true);return;}text(menu,'');var settings=node('button','','设置');settings.id='menu-settings';settings.setAttribute('role','menuitem');settings.onclick=function(){closeMenu(true);rpc('settings',{},function(d,e){if(e)status(e);});};menu.appendChild(settings);if(profiles.length)menu.appendChild(node('div','menu-divider'));
 for(var i=0;i<profiles.length;++i)(function(p){var b=node('button');b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(p.active));b.setAttribute('data-source-id',p.id);b.appendChild(node('span','check',p.active?'✓':''));b.appendChild(node('span','',p.name));b.onclick=function(){closeMenu(true);rpc('selectSource',{profileId:p.id},function(d,e){if(e)status(e);});};menu.appendChild(b);})(profiles[i]);menu.style.display='block';$('settings').setAttribute('aria-expanded','true');settings.focus();}
$('settings').onclick=openMenu;document.onclick=function(e){var t=(e||window.event).target||(e||window.event).srcElement;if(!$('source-menu').contains(t)&&!$('settings').contains(t))closeMenu(false);};document.onkeydown=function(e){e=e||window.event;if($('source-menu').style.display==='none')return;var key=e.keyCode;if(key===27){e.preventDefault();closeMenu(true);}else if(key===38||key===40||key===36||key===35){e.preventDefault();var buttons=$('source-menu').getElementsByTagName('button'),n=0;for(var i=0;i<buttons.length;++i)if(buttons[i]===document.activeElement)n=i;buttons[key===36?0:key===35?buttons.length-1:(n+(key===40?1:-1)+buttons.length)%buttons.length].focus();}else if(key===9)closeMenu(false);};$('category').onchange=function(){history=[];query={view:Number(this.value),path:isFiles()?profiles[source].root:'',text:'',page:0};load();};
$('search').onclick=function(){var q=$('searchtext').value.replace(/^\s+|\s+$/g,'');if(!q){root();return;}history.push(query);query={view:9,path:isFiles()?profiles[source].root:'',text:q,page:0};load();};$('searchtext').onkeydown=function(e){if((e||window.event).keyCode===13)$('search').onclick();};
$('back').onclick=back;$('previous').onclick=function(){if(query.page){--query.page;load();}};$('next').onclick=function(){if(page.more){++query.page;load();}};$('play').onclick=function(){act('play');};$('add').onclick=function(){act('add');};$('download').onclick=function(){act('download');};$('close').onclick=hideDetails;window.onresize=layout;layout();
})();
</script></body></html>
