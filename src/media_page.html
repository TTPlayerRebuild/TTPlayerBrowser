<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千千音乐 · 个人媒体库</title>
<style>
:root{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:#263e4b;background:#f5f9fb;font-size:12px;color-scheme:light;--accent:#2386ad;--line:#dce7ed;--muted:#748a97}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}button,input{font:inherit;color:inherit}button,input{border:1px solid var(--line);border-radius:4px;background:#fff}button{cursor:pointer;padding:4px 8px;white-space:nowrap}button:hover:not(:disabled){border-color:#8fbfcf;background:#edf7fb}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button:disabled{opacity:.42;cursor:default}input{padding:5px 7px;min-width:0}input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;margin:0}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover:not(:disabled){background:#176b90}
header{padding:7px 10px 4px;background:#f1f8fb;border-bottom:1px solid var(--line);flex:none}.search-line{display:flex;gap:6px;margin:0}.search-line input{flex:1;width:0;height:28px}.tabs{display:flex;gap:3px;overflow-x:auto;padding-top:5px;scrollbar-width:thin}.tabs button{background:none;border-color:transparent;padding:4px 8px}.tabs button[aria-current=true]{background:#d6edf6;border-color:#bedde9;color:#146888}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:4px 10px;flex:none;font-size:11px;border-bottom:1px solid #e8eef2}.breadcrumb button{padding:2px 6px;font-size:11px}.location{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.paging{display:flex;gap:4px;align-items:center}.paging span{font-size:11px;color:var(--muted)}main{flex:1;min-height:60px;overflow-y:auto;overflow-x:hidden;padding:7px 10px;scrollbar-width:thin}.empty{text-align:center;color:var(--muted);padding:25px 8px;line-height:1.8}.empty .symbol{font-size:32px;color:#a3c6d6;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px 10px}.card{min-width:0}.art{aspect-ratio:1;overflow:hidden;border-radius:6px;background:linear-gradient(145deg,#daebf3,#c3dae6);position:relative}.cover-open{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;color:#6596ae;font-size:34px;padding:0}.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;pointer-events:none}.art .cover-play{position:absolute;right:6px;bottom:6px;z-index:1;width:28px;height:28px;padding:6px;border:0;border-radius:50%;background:#fffffff0;color:var(--accent);box-shadow:0 1px 5px #29445630}.art .cover-play:hover:not(:disabled){background:var(--accent);color:white}.art .cover-play:disabled{opacity:.7}.card-title{display:block;width:100%;border:0;border-radius:0;padding:0;margin-top:5px;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;line-height:1.5}.card .by{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}.icon{display:block;width:100%;height:100%}
.songs{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:6px;padding:4px 3px;border:1px solid transparent;border-radius:3px;min-width:0}.row:hover{background:#ecf4f8}.row.selected{background:#e1f1f8;border-color:#c7e3ef}.row .track{flex:1;min-width:0;cursor:default}.row .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:17px}.row .by{display:block;color:var(--muted);font-size:11px;line-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .duration{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none}.row-actions{display:flex;gap:1px;flex:none}.row-actions button{width:22px;height:24px;padding:4px;border:0;background:transparent;color:#849ca9}.row-actions button:hover:not(:disabled){background:#dbeef7;color:var(--accent)}.folder-icon{color:#86a5b6;font-size:20px;width:22px;text-align:center}.selection-head{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin:0 4px 3px;height:20px}.selection-head label{display:flex;align-items:center;gap:6px;cursor:pointer}.selection-head span{margin-left:auto}
.details{display:flex;gap:8px;padding:7px 10px;background:#edf5f9;border-top:1px solid var(--line);height:92px;flex:none}.details img{width:72px;height:72px;object-fit:cover;border-radius:4px}.details .copy{flex:1;min-width:0;overflow:auto;scrollbar-width:thin}.details strong{display:block;font-size:12px;overflow-wrap:anywhere}.details .meta{color:var(--muted);font-size:11px;margin:3px 0}.details pre{font-family:inherit;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.details .close{align-self:flex-start;padding:0 4px;border:0;background:none;color:var(--muted)}footer{padding:5px 8px;border-top:1px solid var(--line);background:#fff;flex:none}.footer-tools{display:flex;align-items:center;gap:6px;min-width:0}.paging{flex:1;display:flex;gap:2px;align-items:center;min-width:0}.paging #page-numbers{display:flex;gap:2px}.paging button{min-width:17px;height:20px;padding:0 3px;font-size:11px;border-radius:1px;background:#fff;color:#748a97}.paging button[aria-current=page]{color:#fff;background:#83aabc;border-color:#83aabc}.actions{display:flex;align-items:center;gap:3px;flex:none}.actions button{padding:0 3px;height:20px;font-size:11px;border-radius:1px;background:#fff;color:#617c8b}.actions button span{font-size:10px;color:#8ca5b1;margin-right:1px}.actions .count{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#status{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 4px;overflow-wrap:anywhere}#status:empty{display:none}#status.error{color:#b65342}.settings-button{flex:none;width:22px;height:22px;padding:3px;border:0;background:none;color:#748a97}.settings-button:hover{color:var(--accent)}[hidden]{display:none!important}
@media(max-width:380px){header,.breadcrumb,main{padding-left:7px;padding-right:7px}footer{padding-left:7px}.tabs button{padding:4px 6px}.row{gap:4px}.row-actions button{width:21px}.footer-tools{gap:4px}.actions{gap:2px}.grid{gap:10px 8px;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
#source-menu{position:fixed;right:8px;bottom:32px;z-index:10;min-width:160px;max-width:calc(100vw - 16px);max-height:60vh;overflow:auto;background:#fff;border:1px solid #afc5d1;border-radius:3px;box-shadow:0 3px 12px #1d3a4d30;padding:3px}#source-menu button{display:flex;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:2px;padding:6px 10px 6px 5px;white-space:normal;overflow-wrap:anywhere}#source-menu button:hover,#source-menu button:focus{background:#dceef7;outline:0}#source-menu .check{width:20px;flex:none;color:var(--accent)}#source-menu .menu-divider{border-top:1px solid var(--line);margin:3px 0}</style></head>
<body>
<header><form id="search-form" class="search-line"><input id="search-text" type="search" maxlength="256" placeholder="搜索歌曲…" aria-label="搜索歌曲"><button id="search-button" type="submit">搜索</button></form><nav id="tabs" class="tabs" aria-label="媒体分类"></nav></header>
<div class="breadcrumb"><button id="back" disabled title="返回上一层">‹ 返回</button><span id="location" class="location">正在连接媒体库…</span></div>
<main id="content" aria-label="媒体内容" aria-busy="true"><div class="empty"><div class="symbol">♪</div>正在打开个人媒体库…</div></main>
<section id="details" class="details" hidden aria-label="歌曲详情"><img id="detail-image" alt="封面" hidden><div class="copy"><strong id="detail-title"></strong><div id="detail-meta" class="meta"></div><pre id="detail-lyrics"></pre></div><button id="close-details" class="close" aria-label="关闭详情">×</button></section>
<footer><div id="status" role="status" aria-live="polite"></div><div class="footer-tools"><nav class="paging" aria-label="翻页"><button id="previous" disabled title="上一页" aria-label="上一页">‹</button><span id="page-numbers"><button class="page-number" aria-current="page">1</button></span><button id="next" disabled title="下一页" aria-label="下一页">›</button></nav><div class="actions"><button id="play" disabled title="播放选中歌曲"><span aria-hidden="true">▶</span>播放</button><button id="add" disabled title="添加到播放列表"><span aria-hidden="true">＋</span>添加</button><button id="download" disabled title="下载选中歌曲"><span aria-hidden="true">↓</span>下载</button><span id="selection-count" class="count" role="status">未选择歌曲</span></div><button id="settings" class="settings-button" type="button" title="音乐窗设置" aria-label="设置与媒体来源" aria-haspopup="menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5l.6 2.5 2.1 1.2 2.5-.7 2.5 4.3-1.9 1.7v2.4l1.9 1.7-2.5 4.3-2.5-.7-2.1 1.2-.6 2.5h-5l-.6-2.5-2.1-1.2-2.5.7-2.5-4.3 1.9-1.7V12L1.8 10.3 4.3 6l2.5.7 2.1-1.2Z" transform="translate(1 0) scale(.92)" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div></footer>
<div id="source-menu" role="menu" aria-label="设置与媒体来源" hidden></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), bridge=window.chrome&&window.chrome.webview;
let serial=0, profiles=[], source=0, query={view:0,path:'',text:'',page:0}, history=[], page={items:[],token:0,more:false}, selected=new Set(), generation=0, detailGeneration=0, loading=false, initialized=false, coverObserver=null, coverQueue=[], coverActive=0;
const knownPages=new Map();
function isFiles(){return profiles[source]?.provider===1;}
const pending=new Map(), categories=[['最新专辑',0],['歌手',1],['歌单',2],['全部歌曲',3],['收藏',4]];
function rpc(op,fields={}){return new Promise((resolve,reject)=>{if(!bridge)return reject(Error('请在千千音乐窗内打开此页面'));const id=++serial;const timer=setTimeout(()=>{pending.delete(id);reject(Error('请求超时，请重试'));},45000);pending.set(id,{resolve,reject,timer});bridge.postMessage({id,op,...fields});});}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function iconButton(op,title,handler,cls=''){const b=node('button',cls);b.type='button';b.title=title;b.setAttribute('aria-label',title);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 16 16');svg.setAttribute('aria-hidden','true');svg.classList.add('icon');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',op==='play'?'M4 2.5 13 8 4 13.5Z':op==='add'?'M8 2.5V13.5M2.5 8H13.5':'M8 2V10M4.5 7 8 10.5 11.5 7M3 12V14H13V12');p.setAttribute('fill',op==='play'?'currentColor':'none');if(op!=='play'){p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');}svg.append(p);b.append(svg);b.onclick=e=>{e.stopPropagation();handler(b);};return b;}
async function playContainer(index,button){button.disabled=true;const gen=generation;status('正在读取歌曲…');try{await rpc('playContainer',{token:page.token,index});if(gen===generation)status('已交给千千播放');}catch(e){if(gen===generation)status(e.message,true);}finally{button.disabled=false;}}
function duration(n){return n?Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'';}
function size(n){return n?((n/1048576).toFixed(1)+' MB'):'';}
function setQuery(q,remember=false){if(remember)history.push({...query});query=q;load();}
function nav(){ $('back').disabled=history.length===0;$('previous').disabled=loading||query.page===0;$('next').disabled=loading||!page.more;
 const key=JSON.stringify([source,query.view,query.path,query.text]);let last=knownPages.get(key)||0;
 if(!loading){last=page.more?Math.max(last,query.page+1):query.page;knownPages.set(key,last);}
 const numbers=$('page-numbers');numbers.replaceChildren();const start=Math.max(0,Math.min(query.page-2,last-4));
 for(let n=start;n<=Math.min(last,start+4);++n){const b=node('button','page-number',String(n+1));b.type='button';b.disabled=loading;b.setAttribute('aria-label','第 '+(n+1)+' 页');if(n===query.page)b.setAttribute('aria-current','page');b.onclick=()=>{if(n!==query.page){query.page=n;load();}};numbers.append(b);}
 rpc('navigation',{canBack:history.length>0}).catch(()=>{});}
function tabs(){const parent=$('tabs');parent.replaceChildren();for(const [name,view] of (isFiles()?[['文件夹',5]]:categories)){const b=node('button','',name);b.type='button';b.dataset.view=view;b.setAttribute('aria-current',String(query.view===view));b.onclick=()=>{history=[];$('search-text').value='';setQuery({view,path:isFiles()?profiles[source].root:'',text:'',page:0});};parent.append(b);}}
function selection(){const n=[...selected].filter(i=>page.items[i]&&page.items[i].kind===0).length;for(const id of ['play','add','download'])$(id).disabled=loading||n===0;$('selection-count').textContent=n?'已选 '+n+' 首':'未选择歌曲';for(const r of $('content').querySelectorAll('.row')){const value=selected.has(Number(r.dataset.index));r.classList.toggle('selected',value);const c=r.querySelector('input');if(c)c.checked=value;}}
function hideDetails(){++detailGeneration;$('details').hidden=true;$('detail-image').hidden=true;$('detail-image').removeAttribute('src');$('detail-lyrics').textContent='';}
async function details(index){const i=page.items[index];if(!i)return;const dg=++detailGeneration,token=page.token;const meta=[i.artist,i.album,isFiles()?size(i.size):''].filter(Boolean).join(' · ');$('detail-title').textContent=i.title;$('detail-meta').textContent=meta;$('detail-lyrics').textContent='';$('detail-image').hidden=true;$('details').hidden=false;try{const d=await rpc('details',{token,index});if(dg!==detailGeneration||token!==page.token)return;if(d.image){$('detail-image').src=d.image;$('detail-image').hidden=false;}$('detail-lyrics').textContent=d.lyrics||'';}catch(e){if(dg===detailGeneration)status(e.message,true);}}
function open(index){const item=page.items[index];if(item.kind===0){selected=new Set([index]);selection();act('play');return;}const views={1:6,2:7,3:8,4:5};setQuery({view:views[item.kind],path:item.id,text:'',page:0},true);}
function queueCover(element,index,gen){coverQueue.push({element,index,gen,token:page.token});pumpCovers();}
function pumpCovers(){while(coverActive<2&&coverQueue.length){const job=coverQueue.shift();if(job.gen!==generation)continue;++coverActive;rpc('cover',{token:job.token,index:job.index}).then(d=>{if(job.gen!==generation||!job.element.isConnected||!d.image)return;const img=node('img');img.alt='';img.src=d.image;job.element.append(img);}).catch(()=>{}).finally(()=>{--coverActive;pumpCovers();});}}
function render(){const main=$('content');main.replaceChildren();if(coverObserver)coverObserver.disconnect();coverQueue=[];const gen=generation;
 if(!page.items.length){const e=node('div','empty');e.append(node('div','symbol','♪'),node('div','','这里暂时没有音乐'),node('div','','试试其他分类、关键词，或检查媒体库设置。'));main.append(e);return;}
 const cards=!isFiles()&&page.items.every(i=>i.kind!==0);if(cards){const grid=node('div','grid');coverObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){coverObserver.unobserve(entry.target);queueCover(entry.target,Number(entry.target.dataset.index),gen);}},{root:main,rootMargin:'60px'});
 page.items.forEach((i,index)=>{const card=node('article','card');card.dataset.index=index;const art=node('div','art');art.dataset.index=index;const openCover=node('button','cover-open',i.kind===2?'♬':i.kind===3?'≡':'♪');openCover.type='button';openCover.title='打开 '+i.title;openCover.setAttribute('aria-label',openCover.title);openCover.onclick=()=>open(index);art.append(openCover,iconButton('play','播放 '+i.title,b=>playContainer(index,b),'cover-play'));const title=node('button','card-title',i.title);title.type='button';title.title=i.title;title.onclick=()=>open(index);card.append(art,title,node('span','by',i.artist||({1:'专辑',2:'歌手',3:'歌单'}[i.kind])));grid.append(card);if(i.cover)coverObserver.observe(art);});main.append(grid);
 }else{const head=node('div','selection-head'),label=node('label'),all=node('input');all.type='checkbox';all.setAttribute('aria-label','选择本页所有歌曲');all.onchange=()=>{selected=all.checked?new Set(page.items.map((i,n)=>i.kind===0?n:-1).filter(n=>n>=0)):new Set();selection();};label.append(all,document.createTextNode('全选'));head.append(label,node('span','',page.items.length+' 项'));main.append(head);const list=node('div','songs');
 page.items.forEach((i,index)=>{const r=node('div','row');r.dataset.index=index;const text=node('div','track'),name=node('span','name',i.title);text.append(name);text.title=[i.title,i.artist,i.album].filter(Boolean).join('\n');const meta=isFiles()?size(i.size):[i.artist,i.album].filter(Boolean).join(' · ');if(meta)text.append(node('span','by',meta));if(i.kind===0){const c=node('input');c.type='checkbox';c.setAttribute('aria-label','选择 '+i.title);c.onchange=()=>{c.checked?selected.add(index):selected.delete(index);selection();};r.append(c);text.tabIndex=0;text.onclick=()=>{selected=new Set([index]);selection();details(index);};text.ondblclick=()=>open(index);text.onkeydown=e=>{if(e.key==='Enter')open(index);};const actions=node('div','row-actions');for(const [op,label]of [['play','播放'],['add','添加'],['download','下载']])actions.append(iconButton(op,label+' '+i.title,()=>act(op,[index]),'action-'+op));r.append(text,node('span','duration',duration(i.duration)),actions);}else{r.append(node('span','folder-icon','▰'),text);r.tabIndex=0;r.setAttribute('role','button');r.onclick=()=>open(index);r.onkeydown=e=>{if(e.key==='Enter')open(index);};}list.append(r);});main.append(list);}
 selection();
}
async function load(){if(!profiles.length)return emptySources();const gen=++generation;loading=true;selected.clear();hideDetails();coverQueue=[];if(coverObserver)coverObserver.disconnect();page={items:[],token:0,more:false};selection();tabs();nav();$('content').setAttribute('aria-busy','true');$('content').replaceChildren(node('div','empty','正在读取音乐…'));status('正在读取媒体库…');
 try{const result=await rpc('browse',{profile:source,profileId:profiles[source].id,view:query.view,path:query.path,text:query.text,page:query.page});if(gen!==generation)return;page=result;loading=false;const title=query.view===9?'搜索：'+query.text:result.description||(isFiles()?profiles[source].root:categories.find(c=>c[1]===query.view)?.[0])||'媒体库';$('location').textContent=title;$('location').title=title;render();nav();status('');}
 catch(e){if(gen!==generation)return;loading=false;const empty=node('div','empty'),retry=node('button','','重新加载');retry.onclick=load;empty.append(node('div','symbol','♪'),node('div','',e.message),retry);$('content').replaceChildren(empty);status(e.message,true);nav();}
 finally{if(gen===generation)$('content').setAttribute('aria-busy','false');}}
async function act(op,single=null){const indices=single||[...selected].filter(i=>page.items[i]?.kind===0);if(!indices.length||loading)return;try{await rpc(op,{token:page.token,indices});status(op==='download'?'已加入下载管理，可在顶部切换查看进度':op==='play'?'已交给千千播放':'已加入播放列表');}catch(e){status(e.message,true);}}
function back(){if(history.length){query=history.pop();$('search-text').value=query.text;load();}}
function emptySources(){++generation;loading=false;page={items:[],token:0,more:false};selected.clear();hideDetails();$('tabs').replaceChildren();$('content').replaceChildren(node('div','empty','暂无媒体来源，请从右下角菜单进入设置添加。'));$('content').setAttribute('aria-busy','false');$('location').textContent='媒体来源';selection();nav();status('');}
function changeSource(){closeMenu(false);$('search-text').disabled=$('search-button').disabled=!profiles.length;source=Math.max(0,profiles.findIndex(p=>p.active));history=[];knownPages.clear();if(!profiles.length){query={view:0,path:'',text:'',page:0};emptySources();return;}query={view:isFiles()?5:0,path:profiles[source].root,text:'',page:0};$('search-text').value='';$('search-text').placeholder=isFiles()?'搜索文件或文件夹…':'搜索歌曲…';load();}
async function init(){if(initialized)return;initialized=true;try{profiles=await rpc('profiles');changeSource();}catch(e){initialized=false;status(e.message,true);}}
function closeMenu(focus=true){$('source-menu').hidden=true;$('settings').setAttribute('aria-expanded','false');if(focus)$('settings').focus();}
function openMenu(){const menu=$('source-menu');if(!menu.hidden){closeMenu();return;}menu.replaceChildren();const settings=node('button','','设置');settings.setAttribute('role','menuitem');settings.id='menu-settings';settings.onclick=()=>{closeMenu();rpc('settings').catch(e=>status(e.message,true));};menu.append(settings);if(profiles.length)menu.append(node('div','menu-divider'));
 for(const profile of profiles){const button=node('button');button.setAttribute('role','menuitemradio');button.setAttribute('aria-checked',String(profile.active));button.dataset.sourceId=profile.id;button.append(node('span','check',profile.active?'✓':''),node('span','',profile.name));button.onclick=()=>{closeMenu();rpc('selectSource',{profileId:profile.id}).catch(e=>status(e.message,true));};menu.append(button);}menu.hidden=false;$('settings').setAttribute('aria-expanded','true');settings.focus();}
$('settings').onclick=openMenu;
document.addEventListener('click',e=>{if(!$('source-menu').contains(e.target)&&!$('settings').contains(e.target))closeMenu(false);});
document.addEventListener('keydown',e=>{if($('source-menu').hidden)return;if(e.key==='Escape'){e.preventDefault();closeMenu();}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const buttons=[...$('source-menu').querySelectorAll('button')],n=buttons.indexOf(document.activeElement);buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(n+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();}else if(e.key==='Tab')closeMenu(false);});$('back').onclick=back;$('previous').onclick=()=>{if(query.page){--query.page;load();}};$('next').onclick=()=>{if(page.more){++query.page;load();}};
$('search-form').onsubmit=e=>{e.preventDefault();const text=$('search-text').value.trim();if(text)setQuery({view:9,path:isFiles()?profiles[source].root:'',text,page:0},true);else changeSource();};
for(const op of ['play','add','download'])$(op).onclick=()=>act(op);$('close-details').onclick=hideDetails;
if(bridge)bridge.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;if(m.event==='ready')init();else if(m.event==='refresh')load();else if(m.event==='profilesChanged')rpc('profiles').then(p=>{profiles=p;changeSource();}).catch(e=>status(e.message,true));else if(m.event==='back')back();else if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.ok?p.resolve(m.data):p.reject(Error(m.error||'操作失败'));}});else status('请在千千音乐窗内打开此页面',true);
})();
</script></body></html>
